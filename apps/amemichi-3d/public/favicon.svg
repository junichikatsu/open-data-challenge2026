<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Raindrops -->
  <circle cx="20" cy="14" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="44" cy="12" r="1.2" fill="#38bdf8" opacity="0.6"/>

  <!-- Umbrella Canopy -->
  <path d="M 16 32 C 16 20, 48 20, 48 32 C 43 30, 37 30, 32 32 C 27 30, 21 30, 16 32 Z" 
        fill="url(#greenGrad)" filter="url(#glow)"/>

  <!-- Umbrella Handle / Elevated Amemichi Path -->
  <path d="M 32 30 L 32 46 C 32 49, 29 51, 26 49 C 24 47, 24 44, 26 43" 
        fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wave Ripple underpath -->
  <ellipse cx="32" cy="52" rx="16" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="32" cy="54" rx="9" ry="2.5" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.7"/>
</svg>
