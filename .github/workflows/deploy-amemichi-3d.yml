name: Deploy Amemichi 3D to GitHub Pages

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/amemichi-3d/**'
      - '.github/workflows/deploy-amemichi-3d.yml'
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの制御
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/amemichi-3d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/amemichi-3d/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/amemichi-3d/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
